function adoNote(t, line){ t.notes = (t.notes ? t.notes + '\n' : '') + line; }

// Pure merge of a helper response into state; returns counts. Exposed on the test hook.
function adoApply(res){
  const n = {added: 0, updated: 0, closed: 0, removed: 0, reopened: 0, prAdded: 0, prBlocking: 0, prBack: 0, prDone: 0};
  const byId = new Map(state.tasks.filter(t => t.ado).map(t => [t.ado.id, t]));
  const skip = new Set(state.ado.skip);
  let maxRank = state.tasks.reduce((m, t) => Math.max(m, t.rank), 0);
  for (const it of res.items || []){
    const t = byId.get(it.id);
    const link = {id: it.id, type: it.type, state: it.state, url: it.url, project: it.project, due: isDate(it.due) ? it.due : undefined};
    if (!t){
      if (skip.has(it.id)) continue;
      const nt = {id: uid(), title: it.title || `ADO #${it.id}`, notes: '', color: COLORS[state.colorIdx++ % COLORS.length], rank: ++maxRank,
        value: ADO_VALUE[it.priority] || null, effort: null, due: link.due || null, urgentFlag: false, listId: adoList().id,
        done: false, doneAt: null, wontDo: false, createdAt: todayStr(), ageFrom: todayStr(), waiting: false, nudgeOn: null, focusOn: null, people: []};
      nt.ado = cleanAdo(link);
      state.tasks.push(nt); n.added++;
      continue;
    }
    const before = JSON.stringify([t.title, t.ado, t.due, t.done]);
    if (t.done && t.ado.gone){                       // was closed or reassigned by a sync, now open and yours again
      t.done = false; t.wontDo = false; t.doneAt = null;
      adoNote(t, `Back in ADO as ${it.state || 'open'} on ${fmtLong(todayStr())}.`); n.reopened++;
    }
    if (it.title) t.title = it.title;
    if (t.due === (t.ado.due || null) && link.due) t.due = link.due;   // follow ADO's date unless you changed it here
    t.ado = cleanAdo(link);
    if (before !== JSON.stringify([t.title, t.ado, t.due, t.done])) n.updated++;
  }
  if (res.prs) prApply(res.prs, n);
  for (const g of res.gone || []){
    const t = byId.get(g.id); if (!t) continue;
    if (g.state) t.ado.state = g.state;
    if (t.done){ t.ado.gone = t.ado.gone || g.reason; continue; }
    t.ado.gone = g.reason;
    t.done = true; t.doneAt = todayStr();
    if (g.reason === 'closed'){ n.closed++; }
    else {
      t.wontDo = true; n.removed++;
      adoNote(t, g.reason === 'reassigned' ? `Reassigned in ADO${g.assignedTo ? ' to ' + g.assignedTo : ''} on ${fmtLong(todayStr())}.`
        : `${ADO_GONE[g.reason] || 'Dropped from ADO'} on ${fmtLong(todayStr())}.`);
    }
  }
  return n;
}

// PRs: tier sets a starting value and urgent flag; later tier changes follow only if you haven't changed them here.
function prApply(prs, n){
  const byKey = new Map(state.tasks.filter(t => t.pr).map(t => [t.pr.key, t]));
  const skip = new Set(state.ado.skipPr);
  const on = fmtLong(todayStr());
  let maxRank = state.tasks.reduce((m, t) => Math.max(m, t.rank), 0);
  for (const it of prs.items || []){
    const link = cleanPr(it); if (!link) continue;
    const tier = PR_TIER[link.tier], title = `Review: ${it.title || 'PR ' + link.id}`;
    const t = byKey.get(link.key);
    if (!t){
      if (skip.has(link.key)) continue;
      const nt = {id: uid(), title, notes: '', color: COLORS[state.colorIdx++ % COLORS.length], rank: ++maxRank,
        value: tier.value, effort: 'S', due: null, urgentFlag: tier.urgent, listId: prList().id,
        done: false, doneAt: null, wontDo: false, createdAt: todayStr(), ageFrom: isDate(it.created) ? it.created : todayStr(),
        waiting: link.waiting, nudgeOn: null, focusOn: null, people: link.waiting && link.author ? [canonPerson(link.author)] : []};
      nt.pr = link;
      state.tasks.push(nt); n.added++; n.prAdded++; if (link.tier === 'blocking' && !link.waiting) n.prBlocking++;
      continue;
    }
    const before = JSON.stringify([t.title, t.pr, t.value, t.urgentFlag, t.waiting, t.done]);
    if (t.done && t.pr.gone){                       // done by a sync, now back on you (e.g. your vote reset after a new push)
      t.done = false; t.wontDo = false; t.doneAt = null;
      adoNote(t, `Back for your review on ${on}.`); n.reopened++;
    }
    if (t.pr.tier !== link.tier){
      const old = PR_TIER[t.pr.tier];
      if (t.value === old.value) t.value = tier.value;
      if (t.urgentFlag === old.urgent) t.urgentFlag = tier.urgent;
      adoNote(t, `Now ${tier.label.toLowerCase()} (${tier.tip.toLowerCase()}) as of ${on}.`);
      if (link.tier === 'blocking' && !t.done) n.prBlocking++;
    }
    if (link.waiting && !t.pr.waiting){
      t.waiting = true;
      if (link.author) t.people = [...new Set([...t.people, canonPerson(link.author)])];
      adoNote(t, `You voted Waiting for author on ${on}.`);
    } else if (!link.waiting && t.pr.waiting && !t.done){
      t.waiting = false; t.nudgeOn = null;
      adoNote(t, `Back to you for review on ${on}.`); n.prBack++;
    }
    t.title = title;
    t.pr = link;
    if (before !== JSON.stringify([t.title, t.pr, t.value, t.urgentFlag, t.waiting, t.done])) n.updated++;
  }
  for (const g of prs.gone || []){
    const t = byKey.get(g.key); if (!t) continue;
    t.pr.gone = PR_GONES.includes(g.reason) ? g.reason : 'missing';
    if (t.done) continue;
    t.done = true; t.doneAt = todayStr(); t.waiting = false; t.nudgeOn = null; n.prDone++;
    if (['unassigned', 'draft', 'own', 'missing'].includes(t.pr.gone)) t.wontDo = true;
    adoNote(t, `${PR_GONE[t.pr.gone]} on ${on}.`);
  }
}

async function adoFetch(path, body){
  const r = await fetch(`http://127.0.0.1:${ui.ado.port}${path}`, {
    method: body ? 'POST' : 'GET', cache: 'no-store', targetAddressSpace: 'loopback',
    headers: body ? {'Content-Type': 'application/json'} : undefined, body: body ? JSON.stringify(body) : undefined
  });
  let data = null; try { data = await r.json(); } catch(e) {}
  if (!r.ok) throw new Error((data && data.error) || `Helper answered HTTP ${r.status}`);
  return data;
}
const adoUnreachable = e => e instanceof TypeError || /fetch/i.test(e.message);
const ADO_DOWN = "Can't reach the ADO helper. Is it running on this computer?";

async function adoSync(manual){
  if (adoBusy || !ui.ado.on) return;
  if (!manual && Date.now() - ui.ado.last < ADO_MIN_GAP) return;
  adoBusy = true; setAdo();
  try {
    const known = state.tasks.filter(t => t.ado && !t.done).map(t => t.ado.id);
    const knownPrs = state.tasks.filter(t => t.pr && !t.done).map(t => t.pr.key);
    const res = await adoFetch('/sync', {known, knownPrs});
    flushText();
    const n = adoApply(res);
    ui.ado.last = Date.now(); ui.ado.error = res.prError ? `Pull requests: ${res.prError}` : ''; saveUi();
    const changed = n.added + n.updated + n.closed + n.removed + n.reopened + n.prDone;
    if (changed){ normalizeRanks(state); commit(); }
    const bits = [n.prBlocking && `${n.prBlocking} PR${n.prBlocking > 1 ? 's' : ''} blocked on you`, n.prBack && `${n.prBack} PR${n.prBack > 1 ? 's' : ''} back to you`,
      n.added && `${n.added} new`, n.closed && `${n.closed} closed`, n.removed && `${n.removed} reassigned or removed`, n.reopened && `${n.reopened} reopened`].filter(Boolean);
    if (bits.length) toast(`ADO: ${bits.join(', ')}`, n.added ? 'Show' : null, () => setScope(n.prAdded && n.prAdded === n.added ? state.ado.prListId : state.ado.listId));
    else if (manual) toast(res.prError ? `Work items synced, but pull requests failed: ${res.prError}`
      : `ADO is up to date. ${plural((res.items || []).length, 'open item')}${res.prs ? `, ${plural(res.prs.items.length, 'PR')} to review` : ''}.`);
  } catch(e){
    ui.ado.error = adoUnreachable(e) ? ADO_DOWN : e.message; saveUi();
    if (manual) toast(ui.ado.error);
  } finally { adoBusy = false; setAdo(); }
}

    const sig = JSON.stringify([d.items, d.starting, d.opencode && d.opencode.connected]);

    eng = {...eng, status: 'ok', error: '', data: d, sig,

  if (eng.status !== 'ok') return `<div class="deng"><span>Live dashboard not reachable.</span><span class="grow"></span><button class="lnk" data-d="eng-open">Open Dashboard</button></div>`;
  const i = engItem(t.ado.id), n = i && i.next || {};
  if (i) return `<div class="deng"><span>eng-agents <b>${esc(engLabel(i))}</b>${n.command ? ` · next <code>${esc(n.command)}</code>` : n.action ? ` · ${esc(n.action)}` : ''}</span><span class="grow"></span><button class="btn" data-d="eng-open">Open in Dashboard</button></div>`;
  const st = eng.starting.get(String(t.ado.id));
  if (st) return `<div class="deng"><span><b>Starting</b> in opencode${st.error ? `: ${esc(st.error)}` : '...'}</span><span class="grow"></span><button class="lnk" data-d="eng-open">Watch it</button></div>`;
  if (t.done) return '';
  const bug = /bug/i.test(t.ado.type || '');
  const oc = eng.data && eng.data.opencode && eng.data.opencode.connected;
  return `<div class="deng col"><span>Not started in eng-agents.</span>${oc
    ? `<div class="acts"><button class="btn${bug ? '' : ' primary'}" data-d="eng-start" data-lane="feature">Start as feature</button><button class="btn${bug ? ' primary' : ''}" data-d="eng-start" data-lane="bug">Start as bug</button></div>`
    : '<span class="hint">opencode is not connected to the dashboard.</span>'}</div>`;
}
async function engStart(t, lane, btn){
  if (btn) btn.disabled = true;
  try {
    await engFetch('/api/shell/start', {id: String(t.ado.id), lane});
    toast(`Starting #${t.ado.id} as a ${lane} in opencode`, 'Watch it', () => engOpen(t.ado.id));
    clearInterval(engBurst);
    const until = Date.now() + 60 * 1000, id = String(t.ado.id);
    engBurst = setInterval(() => { if (Date.now() > until || eng.byId.has(id)){ clearInterval(engBurst); return; } engCheck(); }, 3000);
  } catch(e){
    toast(engUnreachable(e) ? "Can't reach the live dashboard." : e.message);
  }
  engCheck();
}

/* the Dashboard view: the live dashboard's own page in a frame, kept loaded once opened */
function engFrame(){
  const pane = $('#engPane');
  let f = $('#engFrame');
  if (f && f.dataset.port !== String(ui.eng.port)){ f.remove(); f = null; }
  if (!f){
    engReady = false;
    f = document.createElement('iframe');
    f.id = 'engFrame'; f.title = 'Work dashboard'; f.dataset.port = ui.eng.port;
    f.allow = 'loopback-network; local-network-access';
    f.src = engBase() + '/?embed=1';
    pane.appendChild(f);
  }
  return f;
}
function engPost(msg){
  const f = $('#engFrame');
  if (f && engReady && f.contentWindow) f.contentWindow.postMessage(msg, engBase());
}
function engSendTheme(){ engPost({type: 'eng-theme', theme: document.documentElement.dataset.theme}); }
window.addEventListener('message', e => {
  const f = $('#engFrame');
  if (!f || e.source !== f.contentWindow || e.origin !== engBase()) return;
  if (e.data && e.data.type === 'eng-ready'){
    engReady = true; engSendTheme();
    if (engFocusId){ engPost({type: 'eng-focus', id: engFocusId}); engFocusId = null; }
  }
});
function engOpen(adoId){
  engFocusId = adoId ? String(adoId) : null;
  if (state.view !== 'dash') setView('dash'); else render();
  if (engFocusId && engReady){ engPost({type: 'eng-focus', id: engFocusId}); engFocusId = null; }
}
function engAction(a){
  if (a === 'reload'){ const f = $('#engFrame'); if (f) f.remove(); eng.status = 'idle'; render(); return; }
  if (a === 'retry'){ eng.status = 'idle'; render(); return; }
  if (a === 'settings'){ eng.status = 'setup'; render(); return; }
  if (a === 'off'){
    ui.eng.on = false; saveUi(); engSchedule();
    const f = $('#engFrame'); if (f) f.remove();
    eng = {status: 'setup', error: '', data: null, byId: new Map(), starting: new Map(), sig: ''};
    render(); toast('Dashboard disconnected'); return;
  }
  if (a === 'connect'){
    const inp = $('#engPort'), port = Math.round(+(inp && inp.value));
    if (!(port >= 1024 && port <= 65535)){ toast('Use a port between 1024 and 65535.'); return; }
    ui.eng.port = port; saveUi(); eng.status = 'idle'; render();
  }
}
function renderDash(){
  if (eng.status === 'idle'){ engCheck(); return; }
  if (eng.status === 'ok'){ engFrame(); return; }
  if (eng.status === 'checking'){ main.innerHTML = `<div class="empty"><b>Connecting to the live dashboard</b>Looking for it at 127.0.0.1:${ui.eng.port}.</div>`; return; }
  const setup = eng.status === 'setup' || !ui.eng.on;
  main.innerHTML = `<div class="engcard">
    <h2>${setup ? 'Connect your work dashboard' : "Can't reach the live dashboard"}</h2>
    ${eng.error ? `<p>${esc(eng.error)}</p>` : `<p>The eng-agents live dashboard runs on this computer. This page shows it here and puts each ADO task's stage next to it. Nothing leaves your computer.</p>`}
    <ol>
      <li>In your workspace, start it: <code>Start-LiveDashboard.ps1</code> from your eng-agents dashboard folder. Keep that window open.</li>
      <li>Let it answer this site. In <code>~/.config/eng-agents/config.json</code> add <code>"dashboard": { "shellOrigins": ["${esc(location.origin)}"] }</code>, then restart it.</li>
      <li>Click Connect. If the browser asks to allow access to apps on this device, choose Allow.</li>
    </ol>
    <div class="acts"><span class="fld"><label for="engPort">Port</label><input type="number" id="engPort" class="mono" min="1024" max="65535" value="${ui.eng.port}"></span>
      <span class="grow" style="flex:1"></span>${ui.eng.on ? '<button class="btn text-danger" data-eng="off">Disconnect</button>' : ''}<button class="btn primary" data-eng="connect">${setup ? 'Connect' : 'Try again'}</button></div>
  </div>`;
}

if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost','127.0.0.1','[::1]'].includes(location.hostname))){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      const ask = w => toast('New version available', 'Reload', () => { swReloading = true; w.postMessage('skipWaiting'); }, 30000);
      if (reg.waiting && navigator.serviceWorker.controller) ask(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const w = reg.installing; if (!w) return;
        w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) ask(w); });
      });
      setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
    }).catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (swReloading) location.reload(); });
  });
}

/* test hook: lets automated checks call the model without the UI */
window.__prioritizer = {get state(){ return state; }, set state(s){ state = s; }, adoApply, adoSync, ui, sanitize, migrateTask, urgency, score, tier, isStale, eKey, vKey, parseQuick, capacityCut, buildWorkbook, parseWorkbook, doImport, render, commit, triageQueue, takeSnap, setSnap: s => { snap = s; }, engCheck, get eng(){ return eng; }};

applyTheme();
applySide();
// First load after the v2 upgrade: diff against the stored v1 board so migrated tasks get change stamps.
const bootRaw = (() => { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e){ return null; } })();
if (bootRaw && bootRaw.version !== 2 && Array.isArray(bootRaw.tasks) && Array.isArray(bootRaw.lists)){
  snap = {tasks: new Map(bootRaw.tasks.map(t => [t.id, stripStamp(t)])), lists: new Map(bootRaw.lists.map(l => [l.id, stripStamp(l)])),
          people: new Set((bootRaw.people || []).map(p => String(p).toLowerCase()))};
  save();
} else snap = takeSnap();
render();
restoreSync();
setAdo(); adoSchedule(); adoSync(false);
engSchedule(); if (ui.eng.on && state.view !== 'dash') engCheck();
})();
</script>
</body>
</html>
