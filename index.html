<!doctype html>
<html lang="en" data-theme="slate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prioritizer</title>
<script>
/* set the theme before first paint so there's no flash */
(function(){ var p = 'system'; try { p = localStorage.getItem('prioritizer.theme') || 'system'; } catch(e) {}
  if (!/^(slate|graphite|ivory|rose|nord|dracula|solarized)$/.test(p)) p = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'graphite' : 'slate';
  document.documentElement.setAttribute('data-theme', p); })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/app-touch-180.png">
<meta name="theme-color" content="#F7F7F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prioritizer">
<link rel="stylesheet" href="themes.css">
<style>
/* ---------- themes live in themes.css (shared with the eng-agents dashboard); app tokens here ---------- */
:root{
  --t1:var(--accent); --t2:color-mix(in srgb,var(--accent) 55%,var(--surface)); --t3:var(--muted); --t4:var(--line);
  --gutter:clamp(1rem,2.2vw,1.75rem);
  --side-w:240px; --side-mini:56px; --drawer-w:360px;
  --row-h:2.4rem;
}
*{box-sizing:border-box}
html{font-size:clamp(13px,.3vw + 10.5px,15px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
svg{display:block}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
kbd{font-family:var(--mono);font-size:.72rem;padding:.02rem .32rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;color:var(--muted);background:var(--surface);line-height:1.3}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- app frame: sidebar | page | drawer ---------- */
.app{display:grid;grid-template-columns:auto minmax(0,1fr) auto;height:100%}
.side{width:var(--side-w);background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;transition:width .16s ease;overflow:hidden}
.page{display:flex;flex-direction:column;min-width:0;min-height:0}
main{flex:1;min-height:0;overflow:auto;padding:.25rem var(--gutter) 2.5rem}

/* sidebar */
.sbrand{display:flex;align-items:center;gap:.55rem;padding:.9rem .75rem .6rem 1rem;min-height:3.2rem}
.logo{width:22px;height:22px;flex:none;color:var(--accent)}
.logo svg{width:100%;height:100%}
.sbrand b{font-weight:600;font-size:1rem;letter-spacing:-.01em;white-space:nowrap}
.sbrand .ibtn{margin-left:auto}
.snav{padding:.2rem .5rem;display:flex;flex-direction:column;gap:1px}
.sitem{display:flex;align-items:center;gap:.6rem;width:100%;min-height:2.1rem;padding:.3rem .55rem;border-radius:8px;color:var(--muted);font-weight:500;font-size:.92rem;text-align:left;white-space:nowrap;cursor:pointer;user-select:none}
.sitem svg{width:17px;height:17px;flex:none}
.sitem:hover{background:var(--hover);color:var(--ink)}
.sitem.on{background:var(--accent-soft);color:var(--ink)}
.sitem .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sitem .n{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.sitem .badge{font-family:var(--mono);font-size:.72rem;font-weight:500;min-width:1.35rem;text-align:center;padding:0 .35rem;border-radius:999px;background:var(--accent);color:var(--on-accent)}
.ssec{display:flex;align-items:center;padding:1rem .55rem .3rem 1.05rem;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ssec .ibtn{margin-left:auto;width:24px;height:24px}
.slists{flex:1;min-height:0;overflow:auto;padding:0 .5rem .5rem}
.sitem.child{padding-left:1.9rem;font-size:.88rem}
.sitem .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none;margin:0 5px}
.sitem.on .dot{background:var(--accent)}
.sitem .more{opacity:0}
.sitem:hover .more,.sitem.on .more,.sitem .more:focus-visible{opacity:1}
.sitem.drop-target{background:var(--accent-soft);color:var(--ink);outline:1px dashed var(--accent)}
.sfoot{display:flex;align-items:center;gap:.15rem;padding:.5rem .6rem .7rem;border-top:1px solid var(--line)}
.sfoot .grow{flex:1}
/* collapsed: icons only */
.app.collapsed .side{width:var(--side-mini)}
.app.collapsed .sbrand{padding-left:.95rem;padding-right:.5rem;flex-direction:column;gap:.6rem;min-height:0}
.app.collapsed .sbrand b,.app.collapsed .sitem .lbl,.app.collapsed .sitem .n,.app.collapsed .ssec,.app.collapsed .slists,.app.collapsed .sfoot .grow{display:none}
.app.collapsed .sbrand .ibtn{margin-left:0}
.app.collapsed .sitem{justify-content:center;padding:.3rem;position:relative}
.app.collapsed .sitem .badge{position:absolute;top:0;right:0;min-width:1rem;font-size:.6rem;padding:0 .2rem}
.app.collapsed .sfoot{flex-direction:column;margin-top:auto}
.app.collapsed .snav{flex:1}
.scrim{display:none}

/* page header: one row */
.phead{display:flex;align-items:center;gap:.6rem 1rem;flex-wrap:wrap;padding:.85rem var(--gutter) .75rem}
.phead .menu-btn{display:none}
.ptitle{display:flex;flex-direction:column;min-width:0}
.ptitle h1{margin:0;font-size:1.3rem;font-weight:600;letter-spacing:-.015em;line-height:1.2}
.scopebtn{align-self:flex-start;font-size:.8rem;color:var(--muted);border-radius:6px;padding:0 .2rem;margin-left:-.2rem;display:flex;align-items:center;gap:.25rem;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.scopebtn:hover{color:var(--ink);background:var(--hover)}
.scopebtn svg{width:10px;height:10px}
.htools{margin-left:auto;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.hadd{margin-left:auto}
.htools+.hadd{margin-left:0}
.lens{display:flex;gap:2px;padding:3px;background:var(--hover);border-radius:9px;border:1px solid var(--line)}
.lens button{padding:.28rem .7rem;border-radius:6px;font-size:.84rem;font-weight:500;color:var(--muted);white-space:nowrap}
.lens button:hover{color:var(--ink)}
.lens button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px color-mix(in srgb,var(--ink) 12%,transparent)}
.cap{display:flex;align-items:center;gap:.35rem;font-size:.82rem;color:var(--muted);white-space:nowrap}
.cap input{width:3.6rem;padding:.25rem .35rem;border:1px solid var(--line);border-radius:7px;background:var(--surface);text-align:right}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:.4rem;min-height:2rem;padding:.35rem .8rem;border-radius:8px;font-size:.86rem;font-weight:500;border:1px solid var(--line);background:var(--surface);white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn svg{width:14px;height:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,var(--ink))}
.btn.primary kbd{background:transparent;color:var(--on-accent);border-color:color-mix(in srgb,var(--on-accent) 40%,transparent)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.text-danger{border-color:transparent;background:transparent;color:var(--danger)}
.btn.text-danger:hover{background:var(--danger-soft)}
.btn:disabled{opacity:.5;cursor:default}
.ibtn{position:relative;width:2rem;height:2rem;min-width:24px;min-height:24px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.ibtn svg{width:17px;height:17px}
.ibtn:hover{background:var(--hover);color:var(--ink)}
.lnk{font-size:.84rem;color:var(--accent);font-weight:500;border-radius:6px;padding:.1rem .3rem;white-space:nowrap}
.lnk:hover{background:var(--accent-soft);color:var(--ink)}

/* ---------- task rows ---------- */
.rows{display:flex;flex-direction:column;gap:4px}
.row{position:relative;display:flex;align-items:center;gap:.5rem;min-height:var(--row-h);padding:.2rem .5rem .2rem .7rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;cursor:pointer;user-select:none;outline:none}
.row::before{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:4px;border-radius:8px 0 0 8px;background:var(--tier,transparent)}
.row[data-tier="1"]{--tier:var(--t1)}.row[data-tier="2"]{--tier:var(--t2)}.row[data-tier="3"]{--tier:var(--t3)}.row[data-tier="4"]{--tier:var(--t4)}
.row:hover{background:var(--hover)}
.row:focus-visible,.row.sel{box-shadow:0 0 0 2px var(--accent)}
.row.dragging{opacity:.35}
.row .rank{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.78rem;color:var(--muted);width:1.5rem;text-align:right;flex:none}
.row .title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;font-size:.95rem}
.row.top .title{font-size:1.06rem;font-weight:600}
.row.top{min-height:2.7rem}
.row.done .title{text-decoration:line-through;color:var(--muted);font-weight:400}
.row .meta{display:flex;align-items:center;gap:.35rem;flex:none;min-width:0;font-size:.76rem;color:var(--muted)}
.row .who{max-width:9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .lst{display:flex;align-items:center;gap:.3rem;max-width:8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .lst i{width:6px;height:6px;border-radius:50%;background:var(--muted);flex:none}
.row .age{font-family:var(--mono);font-size:.72rem;min-width:1.8rem;text-align:right}
.row .score{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--muted);min-width:2rem;text-align:right;flex:none}
.row .score.none{font-family:var(--sans);font-size:.72rem;font-style:italic}
.check{width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:50%}
.check i{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;color:var(--surface);transition:background .12s,border-color .12s}
.check svg{width:10px;height:10px;opacity:0}
.check:hover i{border-color:var(--ink)}
.check:hover svg{opacity:.4;color:var(--ink)}
.done .check i{background:var(--muted);border-color:var(--muted)}
.done .check svg{opacity:1;color:var(--surface)}
.tday{flex:none;height:24px;min-width:24px;padding:0 .55rem;border-radius:999px;border:1px solid var(--line);font-size:.72rem;font-weight:600;color:var(--muted);opacity:0;transition:opacity .12s}
.row:hover .tday,.row:focus-within .tday,.row.sel .tday,.tday.on,.tday:focus-visible{opacity:1}
.tday:hover{color:var(--ink);border-color:var(--muted)}
.tday.on{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:.25rem;font-size:.72rem;font-weight:500;padding:.06rem .45rem;border-radius:999px;background:var(--hover);color:var(--muted);white-space:nowrap;line-height:1.5}
.chip.warn{background:var(--danger-soft);color:var(--danger)}
.chip.acc{background:var(--accent-soft);color:var(--ink)}
button.chip:hover{color:var(--ink);background:var(--line)}
button.chip.warn:hover{color:var(--danger);background:color-mix(in srgb,var(--danger) 18%,var(--surface))}
.chip.ado{font-family:var(--mono);font-size:.7rem}
.dado{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin:.3rem 0 .1rem;font-size:.82rem;color:var(--muted)}
.dado a{color:var(--accent);font-weight:500;text-decoration:none;border-radius:6px;padding:.1rem .3rem;margin-left:-.3rem}
.dado a:hover{background:var(--accent-soft);color:var(--ink)}
/* eng-agents: Dashboard view and work item stages */
.engpane{flex:1;min-height:0;display:flex;padding:0 var(--gutter) var(--gutter)}
.engpane[hidden]{display:none}
.engpane iframe{flex:1;width:100%;min-height:0;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.chip.eng{cursor:pointer;border:0;font-family:inherit}
.chip.eng:hover{background:var(--accent-soft);color:var(--ink)}
.chip.eng.gate{background:var(--warn-soft);color:var(--warn)}
.chip.eng .live{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:engpulse 1.4s ease-in-out infinite}
@keyframes engpulse{50%{opacity:.25}}
.deng{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin:.1rem 0 .2rem;padding:.55rem .7rem;border:1px solid var(--line);border-radius:10px;background:var(--sunk);font-size:.82rem;color:var(--muted)}
.deng b{color:var(--ink);font-weight:600}
.deng code{font-family:var(--mono);font-size:.78rem;color:var(--ink)}
.deng .grow{flex:1}
.deng.col{flex-direction:column;align-items:flex-start}
.deng .acts{display:flex;gap:.4rem;flex-wrap:wrap}
.engcard{max-width:36rem;margin:2.5rem auto;padding:1.4rem 1.5rem;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-size:.9rem;color:var(--muted)}
.engcard h2{margin:0 0 .4rem;font-size:1.05rem;font-weight:600;color:var(--ink)}
.engcard ol{margin:.6rem 0 0;padding-left:1.2rem;display:grid;gap:.45rem}
.engcard code{font-family:var(--mono);font-size:.8rem;color:var(--ink);background:var(--hover);padding:.05rem .3rem;border-radius:5px;word-break:break-all}
.engcard .acts{display:flex;align-items:center;gap:.5rem;margin-top:1.1rem;flex-wrap:wrap}
.engcard .fld{display:flex;align-items:center;gap:.5rem}
.engcard input{width:6.5rem;min-height:2rem;padding:.3rem .5rem;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
@media (prefers-reduced-motion:reduce){.chip.eng .live{animation:none}}
#adoBtn .mk-x{display:none}
#adoBtn[data-ado=error]{color:var(--danger)}
#adoBtn[data-ado=error] .mk-x{display:inline}
#adoBtn[data-ado=busy] svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.steps{margin:.4rem 0 .2rem;padding-left:1.2rem;font-size:.88rem;color:var(--muted)}
.steps li{margin:.3rem 0}
.steps code{font-family:var(--mono);font-size:.8rem;color:var(--ink);background:var(--hover);padding:0 .25rem;border-radius:4px}
.sheet .fld{display:flex;align-items:center;gap:.5rem;margin-top:.6rem;font-size:.86rem}
.sheet .fld input[type=number]{width:6rem}
.row.compact{min-height:2.1rem}
.row.compact .title{font-size:.9rem}

/* capacity line + done group */
.capline{display:flex;align-items:center;gap:.6rem;margin:.55rem 0 .45rem;font-size:.78rem;color:var(--muted)}
.capline::before,.capline::after{content:"";flex:1;border-top:1.5px dashed var(--muted)}
.capline::before{flex:0 0 1.2rem}
.capline b{font-weight:600;color:var(--ink)}
.capline.over b{color:var(--danger)}
.belowcap{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:.1rem 0 .35rem .2rem}
.donegrp{margin-top:1rem}
.donegrp summary{cursor:pointer;font-size:.82rem;color:var(--muted);font-weight:500;padding:.3rem .2rem;list-style:none;display:flex;align-items:center;gap:.35rem;width:max-content;border-radius:6px}
.donegrp summary::-webkit-details-marker{display:none}
.donegrp summary svg{width:12px;height:12px;transition:transform .15s}
.donegrp[open] summary svg{transform:rotate(90deg)}
.donegrp summary:hover{color:var(--ink)}
.donegrp .rows{margin-top:.3rem}
.ranklist{min-height:2.5rem}
.ranklist.drop-over{outline:2px dashed var(--accent);outline-offset:4px;border-radius:10px}
.empty{color:var(--muted);text-align:center;padding:3.5rem 1rem;font-size:.95rem}
.empty b{display:block;color:var(--ink);font-size:1.1rem;font-weight:600;margin-bottom:.3rem}
.soft{font-size:.82rem;color:var(--muted);margin:.6rem 0 0}

/* ---------- matrices ---------- */
.unsorted{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.4rem .7rem;margin:0 0 .8rem;border:1.5px dashed var(--line);border-radius:9px;font-size:.84rem;color:var(--muted);min-height:2.4rem}
.unsorted b{color:var(--ink)}
.unsorted.drop-over{border-color:var(--accent);background:var(--accent-soft)}
.matrix{display:grid;grid-template-columns:1.2rem minmax(0,1fr) minmax(0,1fr);grid-template-rows:1.2rem auto auto;gap:.35rem .75rem}
.axis-x,.axis-y,.grid{display:contents}
.axis-x span{grid-row:1;align-self:end}
.axis-x span:nth-child(1){grid-column:2}.axis-x span:nth-child(2){grid-column:3}
.axis-y span:nth-child(1){grid-column:1;grid-row:2}.axis-y span:nth-child(2){grid-column:1;grid-row:3}
.grid>.quad:nth-child(1){grid-area:2/2}.grid>.quad:nth-child(2){grid-area:2/3}.grid>.quad:nth-child(3){grid-area:3/2}.grid>.quad:nth-child(4){grid-area:3/3}
.axis-x span,.axis-y span{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;font-weight:600}
.axis-y span{writing-mode:vertical-rl;transform:rotate(180deg);align-self:center;justify-self:center}
.quad{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.65rem .65rem .7rem;display:flex;flex-direction:column;min-height:11rem;min-width:0}
.quad.drop-over{border-color:var(--accent);background:var(--accent-soft)}
.quad header{display:flex;align-items:baseline;gap:.5rem;margin:0 .1rem .5rem;flex-wrap:wrap}
.quad h3{margin:0;font-size:.98rem;font-weight:600}
.quad small{color:var(--muted);font-size:.76rem}
.quad .qn{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.quad .ibtn{margin-left:auto;align-self:center;width:26px;height:26px}
.quad .rows{flex:1;max-height:calc(12 * (2.1rem + 4px));overflow:auto;padding:2px}
.qhint{font-size:.8rem;color:var(--muted);padding:.4rem .2rem}
.qform input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.45rem .6rem;outline:none;margin-bottom:4px}
.qform input:focus{border-color:var(--accent)}

/* ---------- today ---------- */
.focus{display:grid;gap:1.25rem 2rem;grid-template-columns:minmax(0,1fr)}
@media (min-width:1180px){.focus{grid-template-columns:minmax(0,1.6fr) minmax(17rem,1fr);align-items:start}}
.fhead{display:flex;align-items:baseline;gap:.3rem .8rem;flex-wrap:wrap;margin:.1rem 0 .5rem}
.fhead .count{margin-left:auto;font-size:.84rem;color:var(--muted)}
.progress{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin:0 0 .8rem}
.progress i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.banner{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.55rem .6rem .55rem .9rem;margin-bottom:.9rem;font-size:.88rem}
.banner span{flex:1;min-width:12rem}
.focus-empty{border:1.5px dashed var(--line);border-radius:12px;padding:2rem 1rem;text-align:center;color:var(--muted);font-size:.9rem}
.focus-empty b{display:block;font-size:1.05rem;color:var(--ink);margin-bottom:.2rem;font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.7rem .7rem .75rem}
.panel+.panel{margin-top:1rem}
.panel.drop-over,.pcard.drop-over{border-color:var(--accent);background:var(--accent-soft)}
.panel>header,.pcard>header{display:flex;align-items:center;gap:.5rem;margin:0 .1rem .55rem}
.panel h3{margin:0;font-size:.95rem;font-weight:600}
.panel>header .n,.pcard>header .n{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.panel>header .lnk{margin-left:auto}
.pempty{font-size:.84rem;color:var(--muted);padding:.2rem .1rem}

/* ---------- triage ---------- */
.tri{max-width:44rem;margin:.4rem auto 0}
.tri-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.2rem 1.3rem 1rem;box-shadow:var(--shadow)}
.tri-top{display:flex;align-items:center;gap:.6rem;font-size:.8rem;color:var(--muted);margin-bottom:.6rem}
.tri-top .grow{flex:1}
.tri h2{margin:0;font-size:1.35rem;font-weight:600;letter-spacing:-.01em;line-height:1.3;word-break:break-word}
.tri .notes{white-space:pre-line;color:var(--muted);font-size:.9rem;margin:.35rem 0 0;max-height:6.5rem;overflow:auto}
.tri .info{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.6rem}
.tri .stale{margin-top:.8rem;padding:.5rem .7rem;border-radius:8px;background:var(--danger-soft);color:var(--danger);font-size:.85rem}
.tfld{display:grid;grid-template-columns:5.2rem minmax(0,1fr);align-items:center;gap:.5rem;margin-top:.85rem}
.tfld>label{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.opt{display:inline-flex;align-items:center;gap:.4rem;min-height:2rem;padding:.25rem .65rem .25rem .4rem;border:1px solid var(--line);border-radius:8px;font-size:.86rem;color:var(--ink);background:var(--surface)}
.opt:hover{background:var(--hover)}
.opt.on{background:var(--accent-soft);border-color:var(--accent)}
.opt kbd{min-width:1.3rem;text-align:center}
.opt .pts{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.tri input[type=date]{border:1px solid var(--line);border-radius:8px;padding:.3rem .5rem;background:var(--surface);min-height:2rem}
.tri-foot{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-top:1.1rem;padding-top:.9rem;border-top:1px solid var(--line)}
.tri-foot .grow{flex:1}
.tri-score{font-size:.82rem;color:var(--muted)}
.tri-score .num{color:var(--ink)}
.tri-done{text-align:center;padding:3rem 1rem;color:var(--muted)}
.tri-done b{display:block;font-size:1.15rem;color:var(--ink);margin-bottom:.35rem}

/* ---------- people ---------- */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,18rem),1fr));gap:1rem;align-items:start}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.75rem .7rem .7rem}
.avatar{width:1.9rem;height:1.9rem;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:600;background:var(--accent-soft);color:var(--ink);flex:none}
.pname{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard>header .ibtn{margin-left:auto;width:26px;height:26px;opacity:.7}
.pcard:hover>header .ibtn{opacity:1}
.sub{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:.75rem .1rem .35rem}
.pcard>header+.sub{margin-top:0}
.pform input{width:100%;margin-top:.6rem;border:1px dashed var(--line);border-radius:8px;padding:.42rem .6rem;background:transparent;outline:none;font-size:.86rem}
.pform input:focus{border-style:solid;border-color:var(--accent);background:var(--surface)}

/* ---------- archive + recap ---------- */
.recap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.95rem 1.05rem 1rem;margin:.1rem 0 1.4rem}
.recap>header{display:flex;align-items:center;gap:.3rem .7rem;flex-wrap:wrap}
.recap h3,.arch-head h3{margin:0;font-size:1.02rem;font-weight:600}
.recap .count,.arch-head .count{font-size:.84rem;color:var(--muted)}
.wknav{display:flex;gap:.15rem;margin-left:auto}
.wknav button:disabled{opacity:.3;cursor:default}
.big{font-family:var(--mono);font-size:2.1rem;line-height:1;margin:.8rem 0 .2rem;font-weight:500}
.big small{font-family:var(--sans);font-size:.88rem;color:var(--muted);margin-left:.45rem;font-weight:400}
.split{margin-top:.8rem}
.splitbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);gap:2px}
.splitbar i{display:block;height:100%}
.split .legend{display:flex;flex-wrap:wrap;gap:.3rem .9rem;margin-top:.45rem;font-size:.8rem;color:var(--muted)}
.split .legend span{display:inline-flex;align-items:center;gap:.35rem}
.split .legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.split .legend .num{color:var(--ink)}
.insight{font-size:.86rem;margin:.5rem 0 0;color:var(--ink)}
.q-do{background:var(--t1)}.q-schedule{background:var(--t2)}.q-delegate{background:var(--t3)}.q-drop{background:var(--t4)}.q-none{background:var(--hover);outline:1px solid var(--line);outline-offset:-1px}
.recap-lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,16rem),1fr));gap:.3rem 1.5rem;margin-top:.9rem}
.recap-lists h4{margin:.4rem 0 .25rem;font-size:.82rem;font-weight:600}
.recap-lists ul{margin:0;padding-left:1.1rem;font-size:.9rem}
.recap-lists li{margin:.15rem 0}
.recap footer{display:flex;align-items:center;gap:.4rem .8rem;margin-top:1rem;flex-wrap:wrap}
.recap footer .soft{margin:0}
.arch-head{display:flex;align-items:center;gap:.75rem;margin:.3rem 0 .4rem}
.arch-head .btn{margin-left:auto}
.day h4{font-weight:600;font-size:.84rem;color:var(--muted);margin:1.1rem 0 .45rem}
.archive .row .title{text-decoration:line-through;color:var(--muted);font-weight:400}

/* ---------- drawer ---------- */
.drawer{width:var(--drawer-w);background:var(--surface);border-left:1px solid var(--line);display:none;flex-direction:column;min-height:0;overflow:auto}
.app.drawer-open .drawer{display:flex}
.dscrim{display:none}
.dhead{display:flex;align-items:center;gap:.4rem;padding:.7rem .7rem .3rem 1.1rem;font-size:.8rem;color:var(--muted)}
.dhead .grow{flex:1}
.dbody{padding:0 1.1rem 1rem;flex:1}
.d-title{width:100%;border:0;outline:0;resize:none;font-size:1.2rem;font-weight:600;padding:.15rem 0;background:transparent;overflow:hidden;line-height:1.3;letter-spacing:-.01em}
.d-notes{width:100%;border:1px solid var(--line);border-radius:9px;outline:0;resize:vertical;padding:.5rem .65rem;font-size:.9rem;min-height:4.2rem;margin:.4rem 0 .2rem;background:var(--bg)}
.d-notes:focus,.dbody input:focus,.dbody select:focus{border-color:var(--accent)}
.dfld{margin-top:.8rem}
.dfld>label,.dfld>.lbl{display:block;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:.35rem}
.seg{display:flex;flex-wrap:wrap;gap:.3rem}
.seg button{min-height:28px;padding:.2rem .6rem;border-radius:7px;font-size:.82rem;border:1px solid var(--line);color:var(--ink);background:var(--surface)}
.seg button:hover{background:var(--hover)}
.seg button.on{background:var(--accent-soft);border-color:var(--accent)}
.seg button .pts{font-family:var(--mono);font-size:.7rem;color:var(--muted);margin-left:.2rem}
.dbody input[type=date],.dbody input[type=text],.dbody select{border:1px solid var(--line);border-radius:8px;padding:.4rem .55rem;background:var(--surface);outline:0;min-height:2rem}
.dbody input[type=text],.dbody select{width:100%}
.drow{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.hint{font-size:.78rem;color:var(--muted)}
.dinfo{margin-top:1rem;padding-top:.8rem;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:.35rem .8rem}
.dinfo .num{color:var(--ink)}
.dfoot{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap;padding:.75rem 1.1rem;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.dfoot .grow{flex:1}

/* ---------- modal, menu, toast, tooltip, command bar ---------- */
.modal{position:fixed;inset:0;display:none;z-index:50;padding:1rem}
.modal.open{display:grid;place-items:center}
.backdrop{position:absolute;inset:0;background:color-mix(in srgb,var(--ink) 30%,transparent);animation:fade .15s ease}
.sheet{position:relative;width:min(32rem,100%);max-height:calc(100vh - 2rem);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:1.15rem 1.25rem 1rem;animation:pop .16s ease}
.sheet.small{width:min(26rem,100%)}
.sheet h3{margin:0 0 .5rem;font-weight:600;font-size:1.1rem}
.sheet p{margin:0 0 .5rem;color:var(--muted);font-size:.9rem}
.sheet footer{display:flex;gap:.5rem;align-items:center;margin-top:1rem}
.sheet input{width:100%;border:1px solid var(--line);border-radius:8px;padding:.5rem .65rem;outline:0;background:var(--surface)}
.sheet input:focus{border-color:var(--accent)}
.grow{flex:1}
.choice{display:grid;gap:.5rem;margin-top:.7rem}
.choice .opt{display:grid;gap:.1rem;text-align:left;padding:.7rem .85rem;border-radius:10px}
.choice .opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.choice .opt b{font-weight:600}
.choice .opt span{font-size:.84rem;color:var(--muted)}
.plist{display:flex;flex-direction:column;gap:2px;margin:.6rem 0 0;max-height:55vh;overflow:auto}
.plist div{display:flex;align-items:center;gap:.6rem;padding:.35rem .4rem;border-radius:6px;font-size:.88rem}
.plist div:nth-child(odd){background:var(--hover)}
.plist .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .mv{font-family:var(--mono);font-size:.76rem;color:var(--muted);min-width:4.2rem;text-align:right}
.plist .mv.up{color:var(--ink);font-weight:500}
.keys{width:100%;border-collapse:collapse;font-size:.86rem;margin-top:.4rem}
.keys td{padding:.3rem .2rem;border-bottom:1px solid var(--line)}
.keys td:first-child{white-space:nowrap;width:42%}
.keys h4{margin:.9rem 0 .2rem;font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.menu{position:fixed;z-index:46;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);padding:.3rem;min-width:11rem;animation:pop .12s ease}
.menu button{display:flex;align-items:center;gap:.55rem;width:100%;text-align:left;padding:.45rem .65rem;border-radius:7px;font-size:.88rem;min-height:28px}
.menu button:hover,.menu button:focus-visible{background:var(--hover);outline:none}
.menu button.on{font-weight:600}
.menu b{font-weight:600}
.menu .danger{color:var(--danger)}
.menu .sep{height:1px;background:var(--line);margin:.25rem .2rem}
.menu .who{padding:.45rem .65rem .4rem;font-size:.8rem;color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:.25rem;max-width:16rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu .who b{display:block;color:var(--ink);font-weight:600;font-size:.86rem;overflow:hidden;text-overflow:ellipsis}
.sw{width:16px;height:16px;border-radius:50%;flex:none;border:1px solid var(--line);position:relative;overflow:hidden}
.sw i{position:absolute;right:0;bottom:0;width:50%;height:50%;border-top-left-radius:100%}
.toast{position:fixed;left:50%;bottom:1.5rem;z-index:60;transform:translate(-50%,1rem);opacity:0;pointer-events:none;background:var(--ink);color:var(--surface);padding:.55rem .6rem .55rem 1rem;border-radius:10px;display:flex;gap:.5rem;align-items:center;font-size:.88rem;box-shadow:var(--shadow-lg);transition:opacity .2s,transform .2s;max-width:calc(100vw - 2rem)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast span{margin-right:.4rem}
.toast button{color:var(--surface);font-weight:600;padding:.2rem .5rem;border-radius:6px;text-decoration:underline;text-underline-offset:2px;min-height:24px}
.toast button:hover{background:color-mix(in srgb,var(--surface) 16%,transparent)}
.tip{position:fixed;z-index:70;max-width:16rem;background:var(--ink);color:var(--surface);font-size:.76rem;line-height:1.35;padding:.38rem .6rem;border-radius:7px;pointer-events:none;opacity:0;transition:opacity .12s;box-shadow:var(--shadow)}
.tip.show{opacity:1}
.cmd{position:fixed;inset:0;z-index:55;display:none}
.cmd.open{display:block}
.cmd .box{position:relative;margin:12vh auto 0;width:min(40rem,calc(100% - 2rem));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);animation:pop .14s ease;overflow:hidden}
.cmd .inrow{display:flex;align-items:center;gap:.5rem;padding:.35rem .5rem .35rem .9rem;border-bottom:1px solid var(--line)}
.cmd .inrow svg{width:16px;height:16px;color:var(--muted);flex:none}
.cmd input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:.7rem 0;font-size:1.05rem}
.cmd input::placeholder{color:var(--muted)}
.cmd .parsed{display:flex;flex-wrap:wrap;gap:.35rem;padding:.6rem .9rem;min-height:2.6rem;align-items:center;font-size:.84rem;color:var(--muted)}
.cmd .help{display:flex;flex-wrap:wrap;gap:.3rem 1rem;padding:.55rem .9rem .7rem;background:var(--bg);border-top:1px solid var(--line);font-size:.76rem;color:var(--muted)}
.cmd .help code{font-family:var(--mono);color:var(--ink)}
.cmd .added{color:var(--ink)}
@keyframes pop{from{opacity:0;transform:scale(.98) translateY(4px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.rename{font:inherit;color:var(--ink);border:0;outline:2px solid var(--accent);background:var(--surface);border-radius:5px;padding:0 .3rem;min-width:3ch;width:100%}

/* folder save indicator: neutral unless something actually needs attention */
#syncBtn .mk-ok,#syncBtn .mk-x{display:none}
#syncBtn[data-sync=on] .mk-ok{display:inline}
#syncBtn[data-sync=paused],#syncBtn[data-sync=error]{color:var(--danger)}
#syncBtn[data-sync=paused] .mk-x,#syncBtn[data-sync=error] .mk-x{display:inline}

/* ---------- breakpoints ---------- */
@media (max-width:1099px){
  .app.drawer-open .drawer{position:fixed;top:0;right:0;bottom:0;z-index:45;box-shadow:var(--shadow-lg)}
  .app.drawer-open .dscrim{display:block;position:fixed;inset:0;z-index:44;background:color-mix(in srgb,var(--ink) 18%,transparent)}
}
@media (max-width:900px){
  .row .age,.row .who{display:none}
}
@media (max-width:759px){
  .side{position:fixed;top:0;bottom:0;left:0;z-index:47;transform:translateX(-100%);transition:transform .18s ease;box-shadow:var(--shadow-lg)}
  .app.side-open .side{transform:none}
  .app.side-open .scrim{display:block;position:fixed;inset:0;z-index:46;background:color-mix(in srgb,var(--ink) 25%,transparent)}
  .app .side .collapse-btn{display:none}
  .phead .menu-btn{display:grid}
  .phead{padding-top:.6rem;gap:.5rem .6rem}
  .ptitle{flex:1}
  .htools{margin-left:0;width:100%;order:3}
  .hadd{order:2}
  .htools .lens{flex:1}
  .htools .lens button{flex:1}
  .addbtn .lbl,.addbtn kbd,.hide-sm{display:none}
  .drawer,.app.drawer-open .drawer{left:0;width:auto}
  .matrix{display:flex;flex-direction:column;gap:.8rem}
  .axis-x,.axis-y{display:none}
  .row .lst{max-width:5rem}
  .row.top .title{font-size:1rem}
  .tfld{grid-template-columns:minmax(0,1fr)}
  .tri-card{padding:1rem}
  kbd{display:none}
  .opt{padding-left:.6rem}
}
@media (hover:none){
  .tday:not(.on){display:none}
  .sitem .more{opacity:1}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Sidebar">
    <div class="sbrand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><rect width="24" height="24" rx="6.5" fill="currentColor"/><g fill="var(--on-accent)"><rect x="5" y="5" width="6.2" height="6.2" rx="1.8"/><path d="M6.6 8.3l1.2 1.1 2-2.2" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><rect x="12.8" y="5" width="6.2" height="6.2" rx="1.8" opacity=".38"/><rect x="5" y="12.8" width="6.2" height="6.2" rx="1.8" opacity=".38"/><rect x="12.8" y="12.8" width="6.2" height="6.2" rx="1.8" opacity=".38"/></g></svg></span><b>Prioritizer</b>
      <button class="ibtn collapse-btn" id="collapseBtn" aria-label="Collapse sidebar" data-tip="Collapse sidebar">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="14" height="12" rx="2"/><path d="M8 4v12"/></svg>
      </button>
    </div>
    <nav class="snav" id="snav" aria-label="Views"></nav>
    <div class="ssec"><span>Scope</span><button class="ibtn" id="addList" aria-label="New list" data-tip="New list"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg></button></div>
    <div class="slists" id="slists"></div>
    <div class="sfoot">
      <button class="ibtn" id="syncBtn" aria-label="Save to folder" data-sync="off">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M2.75 6.25a1.5 1.5 0 0 1 1.5-1.5h3.4l1.6 1.75h6.5a1.5 1.5 0 0 1 1.5 1.5v6.75a1.5 1.5 0 0 1-1.5 1.5H4.25a1.5 1.5 0 0 1-1.5-1.5z"/><path class="mk-ok" d="M7.25 11.25l2 2 3.5-3.75"/><path class="mk-x" d="M8.25 9.5l3.5 3.5M11.75 9.5l-3.5 3.5"/></svg>
      </button>
      <button class="ibtn" id="adoBtn" aria-label="Azure DevOps sync" data-ado="off">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 9.5A6 6 0 0 0 5.2 6.2M4 10.5a6 6 0 0 0 10.8 3.3"/><path d="M16.3 4.8v4.7h-4.6M3.7 15.2v-4.7h4.6"/><path class="mk-x" d="M8.6 8.6l2.8 2.8M11.4 8.6l-2.8 2.8"/></svg>
      </button>
      <span class="grow"></span>
      <button class="ibtn" id="helpBtn" aria-label="Keyboard shortcuts" data-tip="Keyboard shortcuts (?)">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="2.5" y="5" width="15" height="10" rx="2"/><path d="M6 8.5h.01M9 8.5h.01M12 8.5h.01M15 8.5h.01M7 12h6"/></svg>
      </button>
      <button class="ibtn" id="themeBtn" aria-label="Theme" data-tip="Theme">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="6.5"/><path d="M10 3.5a6.5 6.5 0 0 0 0 13z" fill="currentColor"/></svg>
      </button>
      <input type="file" id="importFile" accept=".xlsx,.xls,.csv" hidden>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="page">
    <header class="phead" id="phead"></header>
    <main id="main"></main>
    <div class="engpane" id="engPane" hidden></div>
  </div>
  <div class="dscrim" id="dscrim"></div>
  <aside class="drawer" id="drawer" aria-label="Task details"></aside>
</div>
<div class="cmd" id="cmd">
  <div class="backdrop" data-cmd-close></div>
  <div class="box" role="dialog" aria-modal="true" aria-label="Add a task">
    <div class="inrow">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
      <input id="cmdInput" placeholder="Add a task" aria-label="New task" autocomplete="off" enterkeyhint="done">
      <button class="btn ghost" data-cmd-close>Done</button>
    </div>
    <div class="parsed" id="cmdParsed" aria-live="polite"></div>
    <div class="help"><span><code>@name</code> person</span><span><code>!1</code> to <code>!4</code> value</span><span><code>!!</code> urgent</span><span><code>~xs</code> to <code>~xl</code> effort</span><span><code>^fri</code> due</span><span><code>#list</code> list</span><span><kbd>Enter</kbd> add</span><span><kbd>Esc</kbd> close</span></div>
  </div>
</div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="tip" id="tip" role="tooltip"></div>

<script>
(() => {
'use strict';

/* ---------- constants ---------- */
const KEY = 'prioritizer.v1', THEME_KEY = 'prioritizer.theme', UI_KEY = 'prioritizer.ui';
const COLORS = ['blush','sage','lavender','butter','sky','peach']; // still stored for older copies of the app; no longer shown
const VALUE  = {1: 'Trivial', 2: 'Low', 3: 'Medium', 4: 'High'};
const EFFORTS = ['XS','S','M','L','XL'];
const POINTS = {XS: 1, S: 2, M: 3, L: 5, XL: 8};
const WINDOW = {4: 2, 3: 4, 2: 7, 1: 14};   // implied due window in days, by value
const TIERS  = [2, 1, 0.5];                 // score cutoffs for tiers 1 to 3; below is tier 4
const EQ = {
  do:       {title: 'Do first', sub: 'Important and urgent'},
  schedule: {title: 'Schedule', sub: 'Important, not urgent'},
  delegate: {title: 'Delegate', sub: 'Urgent, not important'},
  drop:     {title: 'Drop',     sub: 'Not urgent, not important'}
};
const VQ = {
  quick: {title: 'Quick wins', sub: 'High value, low effort'},
  big:   {title: 'Big bets',   sub: 'High value, high effort'},
  fill:  {title: 'Fill-ins',   sub: 'Low value, low effort'},
  pit:   {title: 'Money pits', sub: 'Low value, high effort'}
};

const LENSES = {rank: 'List', eisen: 'Eisenhower', ve: 'Value / Effort'};

/* ---------- prioritization model (Build spec: Derived logic) ---------- */

    const d = daysBetween(on, t.due);           // negative when overdue
    return d <= 3 ? 2 : d <= 14 ? 1 : 0;

// Eisenhower needs value only; Value/Effort needs value and effort
const eKey = (t, on) => !t.value ? null
  : t.value >= 3 ? (urgency(t, on) === 2 ? 'do' : 'schedule')
  : (urgency(t, on) === 2 ? 'delegate' : 'drop');
const vKey = t => !isTriaged(t) ? null
  : t.value >= 3 ? (POINTS[t.effort] <= 2 ? 'quick' : 'big')
  : (POINTS[t.effort] <= 2 ? 'fill' : 'pit');
const ageDays = t => Math.max(0, daysBetween(t.ageFrom, today()));

const stillUrgent = t => !t.done && t.urgentFlag && t.value >= 3 && !(t.due && daysBetween(today(), t.due) <= 3) && ageDays(t) > 7;

/* ---------- state ---------- */
function fresh(){

function normalizeRanks(s){

// v1 fields to v2. Runs on every sanitize, so it must be idempotent.
function migrateTask(t){

  if (typeof t.value === 'string' && /^[1-4]$/.test(t.value.trim())) t.value = +t.value;
  if (!(Number.isInteger(t.value) && t.value >= 1 && t.value <= 4)) t.value = null;
  if (t.value == null){ if (t.important === true) t.value = 3; else if (t.important === false) t.value = 2; }
  if (t.effort === 'high') t.effort = 'L'; else if (t.effort === 'low') t.effort = 'S';
  if (typeof t.effort === 'string' && EFFORTS.includes(t.effort.toUpperCase())) t.effort = t.effort.toUpperCase();
  if (!(t.effort in POINTS)) t.effort = null;
  if (t.urgent === true) t.urgentFlag = true;
  t.urgentFlag = t.urgentFlag === true;
  if (!isDate(t.createdAt)) t.createdAt = todayStr();
  if (!isDate(t.ageFrom)) t.ageFrom = t.createdAt;
  if (!isDate(t.due)) t.due = null;
  if (!isDate(t.nudgeOn)) t.nudgeOn = null;
  t.done = t.done === true;
  if (!t.done) t.doneAt = null;
  t.wontDo = t.wontDo === true && t.done;
  t.ado = cleanAdo(t.ado);

// ADO link on a task: {id, type, state, url, project, due, gone}. Anything malformed is dropped.
function cleanAdo(a){
  if (!a || typeof a !== 'object') return null;
  const id = parseInt(a.id, 10);
  if (!(id > 0)) return null;
  const str = v => typeof v === 'string' ? v.slice(0, 500) : '';
  const o = {id, type: str(a.type), state: str(a.state), url: /^https?:\/\//.test(a.url) ? str(a.url) : '', project: str(a.project)};
  if (isDate(a.due)) o.due = a.due;
  if (['closed','removed','reassigned','missing','filtered'].includes(a.gone)) o.gone = a.gone;

// PR review link on a task: {key, id, repo, project, url, author, tier, via, waiting, lastBlocker, gone}.
// key is "<collection url>|<project>|<PR id>" so PRs from two collections never collide.
const PR_GONES = ['reviewed','covered','merged','abandoned','unassigned','draft','own','missing'];

  if (!(id > 0)) return null;

function sanitize(s){

  s.colorIdx = Number.isFinite(s.colorIdx) ? s.colorIdx : 0;
  if (s.view === 'focus') s.view = 'today';
  if (!VIEWS.includes(s.view)) s.view = 'today';
  if (!(s.lens in LENSES)) s.lens = (s.view in LENSES) ? s.view : 'rank';
  s.capacity = Number.isFinite(+s.capacity) && +s.capacity >= 1 ? Math.min(999, Math.round(+s.capacity)) : 20;
  s.capacityAt = Number.isFinite(s.capacityAt) ? s.capacityAt : 0;

  const known = new Map();
  const note = n => { n = String(n ?? '').trim(); if (n && !known.has(n.toLowerCase())) known.set(n.toLowerCase(), n); };
  (Array.isArray(s.people) ? s.people : []).forEach(note);
  s.tasks.forEach(t => { (Array.isArray(t.people) ? t.people : []).forEach(note); });

/* Per-item change stamps so two devices can merge instead of overwriting each other. */
let snap = null;
const stripStamp = o => { const {updatedAt, ...r} = o; return JSON.stringify(r); };
function takeSnap(){
  return {tasks: new Map(state.tasks.map(t => [t.id, stripStamp(t)])), lists: new Map(state.lists.map(l => [l.id, stripStamp(l)])),
          people: new Set(state.people.map(p => p.toLowerCase()))};
}
function stampChanges(){
  const now = Date.now(), cur = takeSnap();
  state.dead = state.dead || {tasks: {}, lists: {}, people: {}};
  state.peopleAt = state.peopleAt || {};
  if (snap){
    for (const k of ['tasks','lists']){
      state[k].forEach(x => { if (snap[k].get(x.id) !== cur[k].get(x.id)){ x.updatedAt = now; delete state.dead[k][x.id]; } });
      snap[k].forEach((_, id) => { if (!cur[k].has(id)) state.dead[k][id] = now; });

    cur.people.forEach(p => { if (!snap.people.has(p)){ state.peopleAt[p] = now; delete state.dead.people[p]; } });
    snap.people.forEach(p => { if (!cur.people.has(p)) state.dead.people[p] = now; });

}

const listById = id => state.lists.find(l => l.id === id);

function canonPerson(n){

/* ---------- quick add syntax (Build spec: Command bar syntax) ---------- */
const DOW = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
function parseDue(x){
  x = x.toLowerCase();
  if (x === 'today' || x === 'tod') return today();
  if (x === 'tomorrow' || x === 'tom' || x === 'tmr') return addDays(today(), 1);
  let m = x.match(/^\+(\d{1,3})([dw])$/);
  if (m) return addDays(today(), +m[1] * (m[2] === 'w' ? 7 : 1));
  if (x.length >= 3){
    const i = DOW.findIndex(d => d.startsWith(x));
    if (i >= 0){ const diff = ((i - new Date().getDay()) + 7) % 7 || 7; return addDays(today(), diff); }
  }
  if (isDate(x) && !isNaN(parseD(x)) && dateStr(parseD(x)) === x) return x;
  return null;
}
function findListPrefix(x){
  x = x.toLowerCase().replace(/[-_]/g, ' ');
  return orderedLists().find(l => l.name.toLowerCase().startsWith(x) || l.name.toLowerCase().replace(/\s+/g, '').startsWith(x.replace(/\s+/g, ''))) || null;

function parseQuick(text){
  const out = {people: [], value: null, effort: null, due: null, urgentFlag: false, listId: null};
  const keep = [];
  String(text || '').split(/\s+/).filter(Boolean).forEach(tok => {
    let m;
    if (tok === '!!'){ out.urgentFlag = true; return; }
    if ((m = tok.match(/^!([1-4])$/))){ out.value = +m[1]; return; }
    if ((m = tok.match(/^~(xs|s|m|l|xl)$/i))){ out.effort = m[1].toUpperCase(); return; }
    if ((m = tok.match(/^\^(.+)$/))){ const d = parseDue(m[1]); if (d){ out.due = d; return; } }
    if ((m = tok.match(/^#(.+)$/))){ const L = findListPrefix(m[1]); if (L){ out.listId = L.id; return; } }
    if ((m = tok.match(/^@([\p{L}\p{N}_'-]+(?:\.[\p{L}\p{N}_'-]+)*)$/u))){ out.people.push(m[1]); return; }
    keep.push(tok);
  });

  return out;
}

/* ---------- task actions ---------- */
function addTask(text, attrs = {}){
  const p = parseQuick(text);
  if (!p.title) return null;
  const people = [...new Set([...(attrs.people || []), ...p.people].map(canonPerson).filter(Boolean))];
  const maxRank = state.tasks.reduce((m,t) => Math.max(m, t.rank), 0);
  const t = {
    id: uid(), title: p.title, notes: '', color: COLORS[state.colorIdx++ % COLORS.length], rank: maxRank + 1,
    value: p.value, effort: p.effort, due: p.due, urgentFlag: p.urgentFlag,
    listId: p.listId || attrs.listId || defaultListId(), done: false, doneAt: null, wontDo: false,
    createdAt: todayStr(), ageFrom: todayStr(), waiting: false, nudgeOn: null, focusOn: null
  };
  for (const k of ['focusOn','waiting']) if (k in attrs) t[k] = attrs[k];
  if (attrs.quad) applyDrop(t, attrs.quad.zone, attrs.quad.kind);
  t.people = people;
  state.tasks.push(t);
  commit();
  return t;
}

  const prev = {done: t.done, doneAt: t.doneAt, wontDo: t.wontDo};
  t.done = true; t.wontDo = true; t.doneAt = todayStr();
  commit();

}

  commit();
  toast(t.ado || t.pr ? 'Task deleted. It won\'t come back from ADO.' : 'Task deleted', 'Undo', () => {
    state.tasks.push(t); if (t.ado) state.ado.skip = state.ado.skip.filter(n => n !== t.ado.id);
    if (t.pr) state.ado.skipPr = state.ado.skipPr.filter(k => k !== t.pr.key); normalizeRanks(state); commit();
  });
}
// Reassign the existing rank slots of these tasks in the given order (hidden tasks keep their place).
function applyOrder(ids){
  const tasks = ids.map(findTask).filter(Boolean);
  const slots = tasks.map(t => t.rank).sort((a,b) => a - b);
  tasks.forEach((t,i) => t.rank = slots[i]);
  commit();
}
function moveTask(id, how){
  const t = findTask(id); if (!t || t.done) return false;
  const list = state.view === 'today' && isFocus(t) ? scopeOpen().filter(isFocus) : scopeOpen();
  const i = list.findIndex(x => x.id === id); if (i < 0) return false;
  const j = how === 'top' ? 0 : how === 'up' ? i - 1 : i + 1;
  if (j < 0 || j >= list.length || j === i) return false;
  const ids = list.map(x => x.id); ids.splice(i, 1); ids.splice(j, 0, id);
  applyOrder(ids);
  return true;
}
// Dragging into a quadrant changes only what's needed to land there (Build spec: Quadrant drops).
function applyDrop(t, zone, kind){
  const raise = () => { if (!t.value || t.value < 3) t.value = 3; };
  const lower = () => { if (!t.value || t.value > 2) t.value = 2; };
  const small = () => { if (!t.effort || POINTS[t.effort] > 2) t.effort = 'S'; };
  const large = () => { if (!t.effort || POINTS[t.effort] < 3) t.effort = 'M'; };
  switch (zone){
    case 'do':       raise(); t.urgentFlag = true;  break;
    case 'schedule': raise(); t.urgentFlag = false; break;
    case 'delegate': lower(); t.urgentFlag = true;  break;
    case 'drop':     lower(); t.urgentFlag = false; break;
    case 'quick': raise(); small(); break;
    case 'big':   raise(); large(); break;
    case 'fill':  lower(); small(); break;
    case 'pit':   lower(); large(); break;
    case 'none':  t.value = null; if (kind === 'eisen') t.urgentFlag = false; else t.effort = null; break;
  }
}
function dropIntoQuadrant(t, zone, kind){
  const before = {value: t.value, effort: t.effort, urgentFlag: t.urgentFlag};
  applyDrop(t, zone, kind);
  commit();
  const undo = ['Undo', () => { Object.assign(t, before); commit(); }];
  if ((zone === 'schedule' || zone === 'drop') && t.due && urgency(t) === 2){
    toast(`Due ${fmtDay(t.due)}, so it stays urgent`, [['Open', () => openDrawer(t.id)], undo]);
  } else {
    const Q = kind === 'eisen' ? EQ : VQ;
    toast(zone === 'none' ? 'Moved to Unsorted' : `Moved to ${Q[zone].title}`, [undo]);
  }
}
function downgradeUrgent(id){
  const t = findTask(id); if (!t) return;
  t.urgentFlag = false; commit();
  toast('No longer urgent', 'Undo', () => { t.urgentFlag = true; commit(); });
}

}
function setScope(id){

/* rows */
function row(t, o = {}){
  const multi = scopeListIds().length > 1;
  const L = listById(t.listId);
  const tr = t.done ? null : tier(t);
  const s = score(t);
  let meta = '';
  if (t.ado) meta += `<span class="chip ado" data-tip="ADO ${esc(t.ado.type)} #${t.ado.id}, ${esc(t.ado.state)}">${esc(adoShort(t.ado.type))} ${t.ado.id}</span>`;
  if (t.ado && !t.done) meta += engChip(t.ado.id);
  if (t.pr){
    meta += `<span class="chip ado" data-tip="${esc(prTip(t.pr))}">PR ${t.pr.id}</span>`;
    if (!t.done && !t.pr.waiting) meta += `<span class="chip${t.pr.tier === 'blocking' ? ' warn' : t.pr.tier === 'asked' ? ' acc' : ''}" data-tip="${esc(PR_TIER[t.pr.tier].tip)}">${t.pr.lastBlocker ? 'Last approval' : PR_TIER[t.pr.tier].label}</span>`;
  }
  if (!t.done){
    if (nudgeDue(t)) meta += `<span class="chip warn" data-tip="Follow-up date ${fmtLong(t.nudgeOn)}">Nudge</span>`;
    else if (t.waiting) meta += `<span class="chip">Waiting</span>`;
    if (t.due){
      const d = daysBetween(today(), t.due);
      meta += `<span class="chip${d < 0 ? ' warn' : d <= 3 ? ' acc' : ''}" data-tip="Due ${fmtLong(t.due)}">${d < 0 ? 'Overdue ' : ''}${fmtDay(t.due)}</span>`;
    }
    if (stillUrgent(t)) meta += `<button class="chip warn" data-act="still" data-tip="Urgent for over a week. Click to make it not urgent.">Still urgent?</button>`;
    else if (isStale(t)) meta += `<span class="chip" data-tip="Older than its window. It's back in Triage.">Stale</span>`;
  }
  if (!o.compact){
    const ppl = t.people.filter(p => p !== o.skipPerson);
    if (ppl.length) meta += `<span class="who">${ppl.map(p => '@' + esc(p)).join(' ')}</span>`;
    if (multi && L) meta += `<span class="lst"><i></i>${esc(L.name)}</span>`;
    if (!t.done) meta += `<span class="age" data-tip="Age">${ageDays(t)}d</span>`;
  } else if (o.showList && multi && L) meta += `<span class="lst"><i></i>${esc(L.name)}</span>`;
  const fon = t.focusOn === todayStr();
  const scoreHtml = t.done || o.noScore ? '' : s != null ? `<span class="score" data-tip="Score: (value + urgency) / effort">${fmtScore(s)}</span>`
    : o.estimate && !t.done ? `<span class="score none">no estimate</span>` : '';
  return `<article class="row${t.done ? ' done' : ''}${o.top ? ' top' : ''}${o.compact ? ' compact' : ''}" data-id="${t.id}"${tr ? ` data-tier="${tr}"` : ''} draggable="true" tabindex="0" aria-label="${esc(t.title)}">`
    + (o.rank != null ? `<span class="rank">${o.rank}</span>` : '')
    + `<button class="check" data-act="done" aria-label="${t.done ? 'Reopen' : 'Complete'}" title="${t.done ? 'Reopen' : 'Complete'}"><i>${ICON.check}</i></button>`
    + `<span class="title">${esc(t.title)}</span>`
    + (meta ? `<span class="meta">${meta}</span>` : '')
    + scoreHtml
    + (t.done || o.noToday ? '' : `<button class="tday${fon ? ' on' : ''}" data-act="today" aria-pressed="${fon}" data-tip="${fon ? 'Remove from Today' : 'Add to Today'}. Shortcut: T">Today</button>`)
    + `</article>`;
}
const doneGroup = (ts, label = 'Done today') => ts.length ? `<details class="donegrp" id="doneGrp"${doneOpen ? ' open' : ''}><summary>${ICON.tri}${label} <span class="num">${ts.length}</span></summary>
  <div class="rows">${ts.map(t => row(t, {compact: true})).join('')}</div></details>` : '';
const emptyHTML = `<div class="empty"><b>A clean slate.</b>Press N to add your first task. It shows up in every view.</div>`;

/* capacity: line goes after the last task that fits (Build spec: Capacity line) */
function capacityCut(open){
  let sum = 0, cut = -1;
  for (let i = 0; i < open.length; i++){
    const pts = isTriaged(open[i]) ? POINTS[open[i].effort] : 0;
    if (sum + pts <= state.capacity){ sum += pts; cut = i; }
    else break;
  }
  if (cut === -1 && open.length){ cut = 0; sum = POINTS[open[0].effort] || 0; }
  return {cut, sum};
}
function renderRank(){
  const open = scopeOpen();
  const done = state.tasks.filter(t => inScope(t) && isDoneToday(t)).sort((a,b) => (b.doneAt || '').localeCompare(a.doneAt || '') || a.rank - b.rank);
  if (!open.length && !done.length){ main.innerHTML = emptyHTML; return; }
  const {cut, sum} = capacityCut(open);
  const over = sum > state.capacity;
  let html = '';
  open.forEach((t, i) => {
    html += row(t, {rank: i + 1, top: i < 3, estimate: true});
    if (i === cut){
      html += `<div class="capline${over ? ' over' : ''}" role="separator"><span><b class="num">${sum}</b> of <span class="num">${state.capacity}</span> pts this week${i === open.length - 1 ? (over ? '' : '. Room for more.') : ''}</span></div>`;
      if (i < open.length - 1) html += `<div class="belowcap">Not this week</div>`;
    }
  });
  main.innerHTML = `<div class="ranklist rows dropzone" data-zone="rank">${html}</div>${doneGroup(done)}`;
}

function renderToday(){

/* triage (Build spec: Triage) */
function triageState(){
  const q = triageQueue();
  const rest = q.filter(t => !tri.seen.has(t.id));
  return {q, rest, cur: rest[0] || null};
}
function renderTriage(){
  const {rest, cur} = triageState();

    tri.id = null; tri.draft = null;
    main.innerHTML = `<div class="tri"><div class="tri-done"><b>${tri.seen.size ? 'Triage done.' : 'Nothing to triage.'}</b>${tri.seen.size ? `You went through ${plural(tri.seen.size, 'task')}.` : 'Every task in scope has a value and an effort.'}

  }

      ${d.due ? `<button class="lnk" data-tdue-clear>Clear</button>` : `<span class="hint">${d.value ? `No date: aging pushes it up after ${fmtDay(addDays(cur.ageFrom, WINDOW[d.value]))}` : 'Optional'}</span>`}</div></div>
    <div class="tfld"><label>Flags</label><div class="opts">
      <button class="opt${d.urgentFlag ? ' on' : ''}" data-tt="urgentFlag" aria-pressed="${d.urgentFlag}"><kbd>U</kbd>Urgent</button>
      <button class="opt${d.today ? ' on' : ''}" data-tt="today" aria-pressed="${d.today}"><kbd>Space</kbd>Today</button></div></div>
    <div class="tri-foot">
      <span class="tri-score">${s != null ? `Score <span class="num">${fmtScore(s)}</span> · ` : ''}${ek ? EQ[ek].title : 'Unsorted'}${vk ? ` · ${VQ[vk].title}` : ''}</span>
      <span class="grow"></span>
      <button class="btn text-danger" data-tact="wont"><kbd>0</kbd>Won't do</button>

/* archive + weekly recap */
function weekRange(off){
  const s = new Date(); s.setHours(0,0,0,0);
  s.setDate(s.getDate() - ((s.getDay() + 6) % 7) + off * 7); // Monday
  const e = new Date(s); e.setDate(e.getDate() + 6);
  return [s, e];
}
function recapData(){
  const [s, e] = weekRange(weekOff), a = dateStr(s), b = dateStr(e), ids = scopeListIds();
  const done = state.tasks.filter(t => t.done && !t.wontDo && t.doneAt && t.doneAt >= a && t.doneAt <= b && ids.includes(t.listId));
  const byList = new Map();
  orderedLists().forEach(L => {
    const ts = done.filter(t => t.listId === L.id).sort((x,y) => (x.doneAt || '').localeCompare(y.doneAt || '') || x.rank - y.rank);
    if (ts.length) byList.set(L, ts);
  });
  // quadrant as of the day it was finished
  const quads = [...Object.keys(EQ), 'none'].map(k => [k, done.filter(t => (eKey(t, t.doneAt || undefined) || 'none') === k).length]);
  const waiting = state.tasks.filter(t => t.waiting && !t.done && ids.includes(t.listId)).sort((x,y) => x.rank - y.rank);
  return {s, e, done, byList, quads, waiting};
}
function recapInsight(r){
  const n = r.done.length; if (n < 3) return '';
  const q = Object.fromEntries(r.quads);
  if (q.do / n >= 0.5) return 'Mostly Do first this week. That usually means firefighting; aim to move more work into Schedule.';
  if (q.schedule && q.schedule >= q.do) return 'More Schedule than Do first. Planned work is winning.';
  return 'Aim for a growing share of work from Schedule.';
}
function recapText(r){
  const withP = t => t.people.length ? ` (${t.people.join(', ')})` : '';
  const out = [`Week of ${fmtMD(r.s)} to ${fmtMD(r.e)}: ${plural(r.done.length,'task')} done`];
  const split = r.quads.filter(x => x[1]).map(([k, c]) => `${k === 'none' ? 'Unsorted' : EQ[k].title} ${c}`).join(', ');
  if (split) out.push(`Split: ${split}`);
  r.byList.forEach((ts, L) => { out.push('', L.name); ts.forEach(t => out.push(`- ${t.title}${withP(t)}`)); });
  if (r.waiting.length){ out.push('', 'Waiting on'); r.waiting.forEach(t => out.push(`- ${t.title}${withP(t)}`)); }
  return out.join('\n');
}

const HEADERS = ['Rank','Task','Notes','Status','Completed On','Value','Effort','Due','Urgent','Score','Focus On','Waiting','Nudge On','People','Age From','Created','ID','ADO ID','ADO Type','ADO State','ADO Link','PR Key','PR Link'];
const NO_XLSX = 'Excel tools did not load. Check your internet connection and reload.';
function exportXlsx(){

  toast('Exported to Excel');

function buildWorkbook(){
  const wb = XLSX.utils.book_new();
  const ordered = orderedLists();
  const used = new Set(['lists']), sheetOf = new Map();
  ordered.forEach(l => {
    const base = (l.name.replace(/[\\\/\?\*\[\]:]/g, ' ').trim() || 'List').slice(0, 31);
    let n = base, i = 2;
    while (used.has(n.toLowerCase())){ const suf = ` (${i++})`; n = base.slice(0, 31 - suf.length) + suf; }
    used.add(n.toLowerCase()); sheetOf.set(l.id, n);
  });
  ordered.forEach(l => {
    const ts = state.tasks.filter(t => t.listId === l.id).sort((a,b) => (a.done - b.done) || a.rank - b.rank);
    let r = 0;
    const rows = ts.map(t => ({
      'Rank': t.done ? '' : ++r, 'Task': t.title, 'Notes': t.notes || '',
      'Status': t.wontDo ? "Won't do" : t.done ? 'Done' : 'Open', 'Completed On': t.doneAt || '',
      'Value': t.value ? VALUE[t.value] : '', 'Effort': t.effort || '', 'Due': t.due || '', 'Urgent': t.urgentFlag ? 'Yes' : '',
      'Score': score(t) == null ? '' : Math.round(score(t) * 10) / 10,
      'Focus On': t.focusOn || '', 'Waiting': t.waiting ? 'Yes' : '', 'Nudge On': t.nudgeOn || '', 'People': t.people.join(', '),
      'Age From': t.ageFrom || '', 'Created': t.createdAt || '', 'ID': t.id,
      'ADO ID': t.ado ? t.ado.id : '', 'ADO Type': t.ado ? t.ado.type : '', 'ADO State': t.ado ? t.ado.state : '', 'ADO Link': t.ado ? t.ado.url : '',
      'PR Key': t.pr ? t.pr.key : '', 'PR Link': t.pr ? t.pr.url : ''
    }));
    const ws = XLSX.utils.json_to_sheet(rows, {header: HEADERS});
    ws['!cols'] = [6,40,40,9,13,9,7,11,8,7,11,8,11,20,11,11,12,8,10,10,30,30,30].map(w => ({wch: w}));
    XLSX.utils.book_append_sheet(wb, ws, sheetOf.get(l.id));
  });
  const meta = XLSX.utils.json_to_sheet(ordered.map(l => ({
    'Sheet': sheetOf.get(l.id), 'List Name': l.name, 'Parent List': l.parentId ? listById(l.parentId).name : '', 'ID': l.id
  })), {header: ['Sheet','List Name','Parent List','ID']});
  meta['!cols'] = [{wch: 32},{wch: 32},{wch: 32},{wch: 12}];
  XLSX.utils.book_append_sheet(wb, meta, 'Lists');
  return wb;
}
const norm = s => String(s ?? '').trim().toLowerCase();
function getter(row){
  const m = new Map(Object.keys(row).map(k => [k.trim().toLowerCase(), row[k]]));
  return k => m.has(k) ? m.get(k) : '';
}
function yn(v){
  if (v === true) return true; if (v === false) return false;
  const s = norm(v);
  if (['yes','y','true','1','x'].includes(s)) return true;
  if (['no','n','false','0'].includes(s)) return false;
  return null;
}
// Value: Trivial/Low/Medium/High or 1 to 4; v1 High/Low map through the migration (high 4, low 2)
function parseValue(v){
  if (typeof v === 'number') return Number.isInteger(v) && v >= 1 && v <= 4 ? v : null;
  const s = norm(v); if (!s) return null;
  if (/^[1-4]$/.test(s)) return +s;
  const m = {trivial: 1, low: 2, lo: 2, medium: 3, med: 3, high: 4, hi: 4, h: 4};
  return m[s] || null;
}
function parseEffort(v){
  const s = norm(v); if (!s) return null;
  const up = s.toUpperCase();
  if (EFFORTS.includes(up)) return up;
  const m = {high: 'L', hi: 'L', h: 'L', low: 'S', lo: 'S', small: 'S', medium: 'M', med: 'M', large: 'L', 'extra small': 'XS', 'extra large': 'XL', '1': 'XS', '2': 'S', '3': 'M', '5': 'L', '8': 'XL'};
  return m[s] || null;
}
function findQuad(Q, v){
  const s = norm(v).replace(/s$/, ''); if (!s) return null;
  return Object.keys(Q).find(k => norm(Q[k].title).replace(/s$/, '') === s || k === s) || null;
}
function toDate(v){
  if (v instanceof Date && !isNaN(v)) return dateStr(v);
  if (typeof v === 'number' && v > 20000) return dateStr(new Date(Math.round((v - 25569) * 864e5) + new Date().getTimezoneOffset() * 6e4));
  const s = String(v ?? '').trim(); if (!s) return null;
  if (isDate(s)) return s;
  const d = new Date(s); return isNaN(d) ? null : dateStr(d);
}
function parseWorkbook(wb){
  const metaName = wb.SheetNames.find(n => norm(n) === 'lists');
  const meta = new Map();
  if (metaName){
    XLSX.utils.sheet_to_json(wb.Sheets[metaName], {defval: ''}).forEach(r => {
      const g = getter(r), sheet = String(g('sheet')).trim();
      if (sheet) meta.set(sheet.toLowerCase(), {name: String(g('list name') || sheet).trim(), parent: String(g('parent list')).trim(), id: String(g('id')).trim()});
    });
  }
  const seen = new Set();
  const keepId = v => { v = String(v ?? '').trim(); if (!v || seen.has(v)) v = uid(); seen.add(v); return v; };
  const lists = [], byName = new Map();
  wb.SheetNames.filter(n => n !== metaName).forEach(sn => {
    const m = meta.get(sn.toLowerCase()) || {name: sn, parent: '', id: ''};
    const l = {id: keepId(m.id), name: m.name, parentId: null, _parent: m.parent, _sheet: sn};
    lists.push(l);
    if (!byName.has(m.name.toLowerCase())) byName.set(m.name.toLowerCase(), l);
  });
  lists.forEach(l => {
    if (!l._parent) return;
    const p = byName.get(l._parent.toLowerCase());
    if (p && p !== l && !p._parent) l.parentId = p.id;
  });
  const tasks = []; let rank = 0, ci = 0;
  lists.forEach(l => {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[l._sheet], {defval: '', raw: true});
    const parsed = [];
    rows.forEach((r, i) => {
      const g = getter(r);
      const title = String(g('task') || g('title') || g('name')).trim();
      if (!title) return;
      let urgent = yn(g('urgent')), important = yn(g('important'));
      const eq = findQuad(EQ, g('eisenhower'));
      if (urgent == null && important == null && eq){ urgent = eq === 'do' || eq === 'delegate'; important = eq === 'do' || eq === 'schedule'; }
      let value = parseValue(g('value')), effort = parseEffort(g('effort'));
      const vq = findQuad(VQ, g('value/effort') || g('value / effort'));
      if (value == null && effort == null && vq){ value = (vq === 'quick' || vq === 'big') ? 4 : 2; effort = (vq === 'quick' || vq === 'fill') ? 'S' : 'L'; }
      const st = norm(g('status')).replace(/[’`]/g, "'");
      const wont = /^won'?t( do)?$|^wont( do)?$/.test(st);
      const done = wont || ['done','complete','completed','closed','yes','true','x'].includes(st);
      const c = norm(g('color'));
      const rkRaw = g('rank'), rk = Number(rkRaw);
      parsed.push({i, rk: String(rkRaw).trim() !== '' && Number.isFinite(rk) ? rk : Infinity, t: {
        id: keepId(g('id')), title, notes: String(g('notes')).trim(), color: COLORS.includes(c) ? c : COLORS[ci++ % COLORS.length], rank: 0,
        value, effort, urgent, important, due: toDate(g('due')), listId: l.id, done, wontDo: wont,
        doneAt: done ? (toDate(g('completed on')) || todayStr()) : null,
        focusOn: toDate(g('focus on')), waiting: yn(g('waiting')) === true, nudgeOn: toDate(g('nudge on')),
        people: String(g('people')).split(',').map(x => x.trim()).filter(Boolean),
        createdAt: toDate(g('created')) || todayStr(), ageFrom: toDate(g('age from')),
        ado: g('ado id') !== '' ? {id: g('ado id'), type: String(g('ado type')), state: String(g('ado state')), url: String(g('ado link'))} : null,
        pr: g('pr key') !== '' ? {key: String(g('pr key')), url: String(g('pr link'))} : null
      }});
    });
    parsed.sort((a,b) => (a.t.done - b.t.done) || (a.rk - b.rk) || (a.i - b.i)).forEach(p => { p.t.rank = ++rank; tasks.push(p.t); });
  });
  lists.forEach(l => { delete l._parent; delete l._sheet; });
  tasks.forEach(migrateTask);
  return {lists, tasks};
}
function doImport(p, mode){
  if (mode === 'replace'){ state.lists = p.lists; state.tasks = p.tasks; }
  else {
    // fresh ids so an imported copy never collides with what's already here
    const lmap = new Map(p.lists.map(l => [l.id, uid()]));
    p.lists.forEach(l => { l.id = lmap.get(l.id); if (l.parentId) l.parentId = lmap.get(l.parentId); });
    p.tasks.forEach(t => { t.id = uid(); t.listId = lmap.get(t.listId); });
    const names = new Set(topLists().map(l => l.name.toLowerCase()));
    p.lists.filter(l => !l.parentId).forEach(l => {
      let n = l.name, i = 2;
      while (names.has(n.toLowerCase())) n = `${l.name} (${i++})`;
      l.name = n; names.add(n.toLowerCase());
    });
    const off = state.tasks.reduce((m,t) => Math.max(m, t.rank), 0);
    p.tasks.forEach(t => t.rank += off);
    state.lists.push(...p.lists); state.tasks.push(...p.tasks);
  }
  state = sanitize(state);
  commit();
  toast(`Imported ${plural(p.tasks.length,'task')}`);
}
function importFile(file){
  if (!window.XLSX){ toast(NO_XLSX); return; }
  const reader = new FileReader();
  reader.onload = () => {
    let p;
    try { p = parseWorkbook(XLSX.read(new Uint8Array(reader.result), {type: 'array', cellDates: true})); }
    catch(e){ toast('Could not read that file.'); return; }
    if (!p.lists.length){ toast('No lists found in that file.'); return; }
    const isEmpty = !state.tasks.length && state.lists.length === 1;
    if (isEmpty) return doImport(p, 'replace');
    showModal(`<div class="sheet small" role="dialog" aria-modal="true" aria-label="Import"><h3>Import ${plural(p.tasks.length,'task')}</h3>
      <p>From ${plural(p.lists.length,'list')}. How should they come in?</p>
      <div class="choice">
        <button class="opt" data-imp="add"><b>Add as new lists</b><span>Keep everything you have.</span></button>
        <button class="opt" data-imp="replace"><b>Replace my board</b><span>Swap everything for this file. Good for restoring a backup.</span></button>
      </div>
      <footer><span class="grow"></span><button class="btn" data-close>Cancel</button></footer></div>`,
      s => s.addEventListener('click', e => {
        const b = e.target.closest('[data-imp]'); if (!b) return;

/* ---------- inline rename ---------- */
function inlineEdit(span, value, label, onSave){
  hideTip();
  const inp = document.createElement('input');
  inp.className = 'rename'; inp.value = value; inp.maxLength = 60; inp.setAttribute('aria-label', label);
  let done = false;
  const finish = keep => {
    if (done) return; done = true;
    const v = inp.value.trim();
    if (keep && v && v !== value) onSave(v); else render();
  };
  inp.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter'){ e.preventDefault(); finish(true); }
    else if (e.key === 'Escape'){ e.preventDefault(); finish(false); }
  });
  inp.addEventListener('click', e => e.stopPropagation());
  inp.addEventListener('blur', () => finish(true));
  span.replaceWith(inp);
  inp.focus(); inp.select();
}

function renamePerson(oldN, newN){

  const clash = state.people.find(p => p !== oldN && p.toLowerCase() === newN.toLowerCase());
  const target = clash || newN;
  state.people = clash ? state.people.filter(p => p !== oldN) : state.people.map(p => p === oldN ? target : p);
  state.tasks.forEach(t => { if (t.people.includes(oldN)) t.people = [...new Set(t.people.map(p => p === oldN ? target : p))]; });

  if (clash) toast(`Merged into ${clash}`);

  state.tasks.forEach(t => { t.people = t.people.filter(p => p !== n); });
  commit();
  toast(`Removed ${n}`, 'Undo', () => {
    state.people.splice(Math.min(idx, state.people.length), 0, n);

/* ---------- autosave to a folder (Chrome / Edge) ---------- */
const FILE_NAME = 'prioritizer.xlsx';
const fsOK = typeof window.showDirectoryPicker === 'function';
let dirHandle = null, sync = 'off', lastSig = '', lastFileMod = 0, writeTimer = null, writing = false, syncWarned = false;
const dataSig = () => JSON.stringify([state.lists, state.tasks]);
const isBlank = () => !state.tasks.length && state.lists.length === 1;

function idb(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('prioritizer', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function kvGet(k){
  const db = await idb();
  return new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); });
}
async function kvSet(k, v){
  const db = await idb();
  return new Promise(res => {
    const tx = db.transaction('kv', 'readwrite'), st = tx.objectStore('kv');
    v === undefined ? st.delete(k) : st.put(v, k);
    tx.oncomplete = () => res(); tx.onerror = () => res();
  });
}
const xlsxReady = () => new Promise(res => window.XLSX || document.readyState === 'complete' ? res() : window.addEventListener('load', res, {once: true}));

function setSync(s){
  sync = s;
  const b = $('#syncBtn'), where = dirHandle ? `${dirHandle.name}/${FILE_NAME}` : FILE_NAME;
  b.dataset.sync = fsOK ? s : 'na';
  b.dataset.tip = !fsOK ? 'Download or import an Excel copy'
    : s === 'on' ? `Saving a copy to ${where}`
    : s === 'paused' ? `Folder copy paused. Click to reconnect to ${dirHandle ? dirHandle.name : 'your folder'}.`
    : s === 'error' ? `Can't save to ${where}. Close it in Excel if it's open.`
    : 'Excel copy: download, import, or keep one in a folder';
  if (tipFor === b) placeTip(b);
}
async function readFolderFile(){
  let fh;
  try { fh = await dirHandle.getFileHandle(FILE_NAME); } catch(e){ if (e.name === 'NotFoundError') return null; throw e; }
  const f = await fh.getFile();
  const p = f.size ? parseWorkbook(XLSX.read(new Uint8Array(await f.arrayBuffer()), {type: 'array', cellDates: true})) : null;
  return {p: p && p.lists.length ? p : null, mod: f.lastModified};
}
function applyFile(p){
  state.lists = p.lists; state.tasks = p.tasks;
  state = sanitize(state);
  lastSig = dataSig();
  commit();
}
function scheduleWrite(){
  if (sync !== 'on' && sync !== 'error') return;
  clearTimeout(writeTimer); writeTimer = setTimeout(writeFolderFile, 600);
}
async function writeFolderFile(){
  if (!dirHandle || !window.XLSX || (sync !== 'on' && sync !== 'error')) return;
  const sig = dataSig(); if (sig === lastSig) return;
  if (writing){ scheduleWrite(); return; }
  writing = true;
  try {
    const fh = await dirHandle.getFileHandle(FILE_NAME, {create: true});
    const w = await fh.createWritable();
    await w.write(new Uint8Array(XLSX.write(buildWorkbook(), {bookType: 'xlsx', type: 'array'})));
    await w.close();
    lastSig = sig; lastFileMod = (await fh.getFile()).lastModified; syncWarned = false;
    setSync('on');
  } catch(e){
    setSync('error');
    if (!syncWarned){ syncWarned = true; toast(`Couldn't save to ${FILE_NAME}. If it's open in Excel, close it and it will retry.`); }
  } finally { writing = false; }
}
async function connect(handle, interactive){
  dirHandle = handle;
  await kvSet('dir', handle);
  await xlsxReady();
  if (!window.XLSX){ setSync('paused'); toast(NO_XLSX); return; }
  let r;
  try { r = await readFolderFile(); } catch(e){ setSync('error'); toast(`Couldn't read ${FILE_NAME}.`); return; }
  setSync('on');
  if (!r || !r.p){ lastSig = ''; await writeFolderFile(); if (interactive) toast(`Saving to ${handle.name}/${FILE_NAME}`); return; }
  lastFileMod = r.mod;
  const fileWins = () => { applyFile(r.p); toast(`Loaded ${FILE_NAME} from ${handle.name}`); };
  const boardWins = async () => { lastSig = ''; await writeFolderFile(); toast(`Saving to ${handle.name}/${FILE_NAME}`); };
  if (isBlank()) return fileWins();
  if (!interactive) return r.mod > (state.updatedAt || 0) ? fileWins() : boardWins();
  showModal(`<div class="sheet small" role="dialog" aria-modal="true" aria-label="File exists"><h3>${FILE_NAME} already exists</h3>

const PR_TIER = {
  blocking: {value: 4, urgent: true, label: 'Blocking', tip: "You're a required reviewer, so it can't merge without you"},
  asked: {value: 3, urgent: false, label: 'Asked', tip: 'You were added by name as an optional reviewer'},

  unassigned: 'No longer a reviewer', draft: 'Back to draft', own: 'Your own PR', missing: 'Not found in ADO'};
